<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#051424" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <g stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none">
    <!-- Abstract Infrastructure / IT / Logistics / Power -->
    <path d="M0,800 Q400,600 800,800 T1920,500" />
    <path d="M0,600 Q300,400 900,700 T1920,300" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="800" cy="800" r="8" fill="#0A2540" stroke="rgba(255,255,255,0.3)"/>
    <circle cx="900" cy="700" r="12" fill="#0A2540" stroke="rgba(255,255,255,0.5)"/>
    <circle cx="1400" cy="650" r="6" fill="#0A2540" stroke="rgba(255,255,255,0.3)"/>
  </g>
</svg>
